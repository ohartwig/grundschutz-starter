# Kai Ole Hartwig pre-commit + pre-push hook manifest (Phase 12.3).
#
# lefthook (https://lefthook.dev) gives us a first defense line locally
# so common CI failures (style, secrets, malformed config) get caught
# before push. CI still re-runs all of these as the authoritative gate.
#
# Install once per machine: `mise install` (lefthook is pulled in via
# .mise.toml [tools]) — or `brew install lefthook` / `go install`.
# Activate per repo: `lefthook install`. Hook scripts live in .git/hooks
# but stay tracked in version control via this file.
#
# Skip a single commit (when you know what you're doing):
#   LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  commands:
    editorconfig:
      glob: "*"
      # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/ci-mirrors/editorconfig-checker
      run: docker run --rm --network none -v "$PWD:/check:ro" -w /check registry.ole-hartwig.eu/devops/ci-mirrors/editorconfig-checker:v3.11.3@sha256:b3128d82e0518b81df28d245200d86de4bf361f065668be1d1626aacd47b785e ec {staged_files}
      stage_fixed: false
    # The same scanner as the CI gate (test-tools/test-secret-scan), from our
    # own mirror and pinned by digest. Until 2026-11-03 this pulled
    # zricethezav/gitleaks:latest from Docker Hub: an unpinned image from a
    # third-party registry, run with the repository mounted, on every commit.
    # verified + unknown: a key the provider confirms, or one it could not be
    # asked about; plain pattern matches without either stay out, as in CI.
    # --no-update: the binary must not replace itself inside the hook.
    secrets-trufflehog:
      glob: "*"
      # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/ci-mirrors/trufflehog
      run: docker run --rm -v "$PWD:/check:ro" -w /check registry.ole-hartwig.eu/devops/ci-mirrors/trufflehog:v3.97.1-dev@sha256:2f20eb12ad6fc780e8771910e2788a42168ab3dd3396128d4fa65f5183ac26e4 filesystem --no-update --results=verified,unknown --fail {staged_files}
    markdownlint:
      glob: "*.md"
      # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/ci-mirrors/markdownlint-cli2
      run: docker run --rm --network none -v "$PWD:/check:ro" -w /check registry.ole-hartwig.eu/devops/ci-mirrors/markdownlint-cli2:v0.24.0@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca {staged_files}
    prettier-json:
      glob: "*.{json,jsonc}"
      # Exact version: npx -y with a bare name runs whatever is newest.
      # renovate: datasource=npm depName=prettier
      run: npx -y prettier@3.9.10 --check {staged_files}
      stage_fixed: false

commit-msg:
  commands:
    commitlint:
      run: |
        # commitlint installed via mise/npm or composer; falls back to a
        # local regex check if neither is available.
        if command -v commitlint >/dev/null 2>&1; then
          commitlint --edit {1}
        else
          head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|ci|chore|build|revert)(\([^)]+\))?!?: .+' \
            || { echo "Commit subject must follow Conventional Commits (feat/fix/docs/.../chore[!?][(<scope>)]: <subject>)"; exit 1; }
        fi

pre-push:
  parallel: true
  commands:
    composer-audit:
      glob: "composer.{json,lock}"
      run: |
        if [ -f composer.lock ]; then
          # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/images/franken-php/ci
          # A bare `8.5` tag does not exist (checked 2026-11-03): the image is
          # published as <version>-<php>, so this line could never pull.
          docker run --rm -v "$PWD:/app:ro" -w /app registry.ole-hartwig.eu/devops/images/franken-php/ci:3.2.147-8.5@sha256:d30af20bc82a1566e65e3675e1b10d31f4b791bf18517a9cdf27588ea6a1a5bf composer audit --no-dev --format=plain
        fi
    trivy-fs:
      # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/ci-mirrors/trivy
      run: docker run --rm -v "$PWD:/scan:ro" registry.ole-hartwig.eu/devops/ci-mirrors/trivy:v0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs --severity HIGH,CRITICAL --exit-code 1 /scan
      # opt-in via `LEFTHOOK_ALLOW_TRIVY=1 git push`
      skip:
        - run: test "${LEFTHOOK_ALLOW_TRIVY:-0}" != "1"
    commit-signing-check:
      # SDLC gap G-SDLC-002 — local hint only, does not block the commit.
      run: |
        FMT=$(git config --get gpg.format 2>/dev/null || true)
        KEY=$(git config --get user.signingkey 2>/dev/null || true)
        SIGN=$(git config --get commit.gpgsign 2>/dev/null || true)
        if [ -z "$FMT" ] || [ -z "$KEY" ] || [ "$SIGN" != "true" ]; then
          echo "[commit-signing] WARNING: signing config incomplete (see igs/engineering/commit-signing-policy.md)"
        fi
      stage_fixed: false
      interactive: false
