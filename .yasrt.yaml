# Release configuration for yasrt; the shared defaults come from the CI
# component. Tags are v${version}; the first release is 0.1.0.
tag_format: "v${version}"
versioning:
  initial: "0.1.0"
deliverability:
  non_release_paths: [".gitlab-ci.yml", ".yasrt.yaml", ".gitlab/", "checks.config.json", "system.json", "tailoring.json"]
